name: Demo-safe implementation
description: Track one implementation unit without copying canonical design or decision prose.
title: "[ISSUE-][VS-] "
body:
  - type: markdown
    attributes:
      value: |
        日本語を正本にし、reference-only content、最終回答、自由記述のplaytest dataを含めないでください。
        Playableの意味を変更する場合は、実装Issueではなく人間が承認するADRが必要です。
  - type: input
    id: issue-id
    attributes:
      label: Issue stable ID
      description: GitHub番号とは別のISSUE ID
      placeholder: ISSUE-021
    validations:
      required: true
  - type: input
    id: domain-id
    attributes:
      label: Domain stable IDs
      description: VS、EXP、BLDなど。未作成のIDを捏造しない。
      placeholder: VS-001
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: demo-safeかつai_eligibleなDRV IDとcatalogで宣言済みのlocator
      placeholder: |
        DRV-001 — md:heading/active-receiving
        DRV-003 — md:heading/catch-and-chain
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 検証可能な受入条件
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: Demo-safe synthetic content only
          required: true
        - label: Evidence、Inference、Proposalを分離した
          required: true
        - label: No PII, free-text playtest data, or browser GitHub token
          required: true
        - label: No final Finding, Play DNA, Design Bet, ADR answer key, or reference-only content
          required: true
